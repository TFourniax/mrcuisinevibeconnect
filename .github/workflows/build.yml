# Checks every push on a working branch: core tests, then the APK (kept 14 days as an artifact,
# to install by hand with adb). Releases are published only from main (release.yml).
name: Build

on:
  push:
    branches: ['claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Tests and build
        run: ./gradlew --no-daemon :core:test :app:assembleRelease

      # Toque trusts Android 6's own roots plus the bundled ones (assets/certs/foyer-roots.pem). Each
      # Foyer host must chain to a bundled root by itself (no system store here), whatever Android 6
      # knows: the site (recipes, status) and its database (agents' status).
      - name: Bundled roots cover Foyer's hosts
        run: |
          for host in foyer-life.netlify.app mhfrnaiurtgkoqraabfg.supabase.co; do
            out=$(SSL_CERT_FILE=/dev/null SSL_CERT_DIR=/nonexistent openssl s_client -connect "$host:443" -servername "$host" \
              -CAfile app/src/main/assets/certs/foyer-roots.pem -showcerts </dev/null 2>&1)
            echo "$out" | grep -E "^ *[0-9]+ s:|^ +i:|Verify return code" | sed "s|^|$host  |"
            echo "$out" | grep -q "Verify return code: 0 (ok)" || { echo "::error::$host does not chain to a bundled root"; exit 1; }
          done

      # Android 6 on the robot: any newer Java or Android API in the app fails here, not in the kitchen.
      - name: Android 6 API check
        run: ./gradlew --no-daemon :app:lintRelease

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: toque-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
