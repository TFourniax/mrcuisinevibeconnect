# Checks every push on a working branch: core tests, then the APK (kept 14 days as an artifact,
# to install by hand with adb). Releases are published only from main (release.yml).
name: Build

on:
  push:
    branches: ['claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Tests and build
        run: ./gradlew --no-daemon :core:test :app:assembleRelease

      # Android 6 on the robot: any newer Java or Android API in the app fails here, not in the kitchen.
      - name: Android 6 API check
        run: ./gradlew --no-daemon :app:lintRelease

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: toque-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
